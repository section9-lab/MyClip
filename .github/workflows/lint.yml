name: Lint

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'MyClip/**'
      - 'Sources/**'
      - 'Tests/**'
      - '.swiftlint.yml'
      - 'Scripts/test.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'MyClip/**'
      - 'Sources/**'
      - 'Tests/**'
      - '.swiftlint.yml'
      - 'Scripts/test.sh'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint 0.65.1
        env:
          SWIFTLINT_URL: https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl -sSL -o "$RUNNER_TEMP/swiftlint.zip" "$SWIFTLINT_URL"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/swiftlint/swiftlint" 2>/dev/null || true
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Lint
        run: bash Scripts/test.sh lint
