name: Release DMG

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Validate release version and runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MyClip/Supporting/Info.plist)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          xcodebuild -version

      - name: Import stable signing certificate
        env:
          APPLE_SIGNING_CERTIFICATE_P12: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$APPLE_SIGNING_CERTIFICATE_P12" || -z "$APPLE_SIGNING_IDENTITY" || "$APPLE_SIGNING_IDENTITY" == "-" ]]; then
            echo "::error::Configure a stable Apple signing identity and certificate before publishing. See docs/release-signing.md."
            exit 1
          fi
          certificate="$RUNNER_TEMP/myclip-signing.p12"
          keychain="$RUNNER_TEMP/myclip-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "myclip-signing.p12").write_bytes(base64.b64decode(os.environ["APPLE_SIGNING_CERTIFICATE_P12"], validate=True))'
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Test packaging
        run: python3 Scripts/test_package_dmg.py

      - name: Test MyClip core and local adapters
        run: |
          swift test
          node --test Scripts/test_ephemeral_codex.cjs

      - name: Test native app with macOS 13 deployment target
        run: |
          bash Scripts/test_agent_activation.sh
          bash Scripts/test_capture_lifecycle.sh
          bash Scripts/test_capture_filters.sh
          bash Scripts/test_screenshot_documents.sh
          bash Scripts/test_memory_directory.sh
          bash Scripts/test_memory_scrolling.sh
          bash Scripts/test_task_board_scrolling.sh

      - name: Build architecture-specific DMG
        env:
          MYCLIP_ARCH: ${{ matrix.arch }}
          CODE_SIGN_IDENTITY_OVERRIDE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash Scripts/package_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/MyClip-*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/myclip-signing.p12"
          if [[ -f "$RUNNER_TEMP/myclip-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/myclip-signing.keychain-db"
          fi

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download both DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true

      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/MyClip-$version-arm64.dmg"
          test -f "dist/MyClip-$version-x86_64.dmg"
          (cd dist && sha256sum ./*.dmg > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS \
              --verify-tag --title "MyClip $version" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
          fi
