name: MyClip
options:
  bundleIdPrefix: cc.vibevibe
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    GENERATE_INFOPLIST_FILE: NO
schemes:
  MyClip:
    build:
      targets:
        MyClip: all
packages:
  MyClipCore:
    path: .
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
targets:
  MyClip:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MyClip
        excludes:
          - Core/**
          - App/KaraApp.swift
          - Features/AgentBridge/**
          - Features/AIIntegration/**
          - Features/CursorCompanion/**
          - Features/IMChannel/**
          - Features/ScheduledTasks/**
          - Features/Settings/**
          - Services/**
          - Supporting/AppIcon.icon/**
          - Supporting/IconSources/**
          - Supporting/Kara.icns
    dependencies:
      - package: MyClipCore
        product: MyClipCore
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.vibevibe.myclip
        PRODUCT_NAME: MyClip
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: E04719740CD0DF70E4D0CA1B42ABBD273B4E0F9A
        DEVELOPMENT_TEAM: YP86S77K2X
        INFOPLIST_FILE: MyClip/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyClip/Supporting/MyClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        LSUIElement: NO
